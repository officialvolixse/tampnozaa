    <script>
    function openModal(src) {
      const modal = document.getElementById('modal');
      const modalContent = document.getElementById('modalContent');
      const img = document.getElementById('modalImg');

      img.src = src;
      modal.classList.remove('hidden');

      modalContent.classList.add('fade-enter');
      setTimeout(() => {
        modalContent.classList.add('fade-enter-active');
        modalContent.classList.remove('fade-enter');
      }, 10);
    }

    function closeModal() {
      const modal = document.getElementById('modal');
      const modalContent = document.getElementById('modalContent');

      modalContent.classList.remove('fade-enter-active');
      modalContent.classList.add('fade-leave');
      setTimeout(() => {
        modalContent.classList.remove('fade-leave');
        modal.classList.add('hidden');
      }, 200);
    }
  </script>
